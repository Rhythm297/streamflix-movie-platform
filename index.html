
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlix - Watch Movies & Shows</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <h1 class="logo">STREAMFLIX</h1>

        <nav>
            <a href="#home">Home</a>
            <a href="#movies">Movies</a>
            <a href="#tv">TV Shows</a>
            <a href="#mylist">My List</a>
        </nav>

        <input id="searchInput" type="text"
               placeholder="Search movies and shows...">

        <div id="authButtons">
    <button onclick="showAuth('login')">Sign In</button>
    <button onclick="showAuth('signup')">Sign Up</button>
</div>
    </header>

    <main id="app">
        <section id="hero" class="hero">
            <h2>Welcome to StreamFlix</h2>
            <p>Discover movies and shows you'll love.</p>
        </section>

        <div id="content">
            <p class="loading">Loading movies...</p>
        </div>
    </main>
    <div id="movieModal" class="modal"></div>
    <div id="authModal" class="modal">
    <div class="modal-content">
        <button class="close-modal" onclick="closeAuth()">✕ Close</button>

        <h2 id="authTitle">Sign In</h2>

        <form id="authForm">
            <input
                id="authEmail"
                type="email"
                placeholder="Email address"
                required
            >

            <input
                id="authPassword"
                type="password"
                placeholder="Password"
                minlength="6"
                required
            >

            <button id="authSubmit" type="submit">Sign In</button>
        </form>

        <p id="authMessage"></p>
        <p id="authSwitch">
            Don't have an account?
            <a href="#" onclick="showAuth('signup'); return false;">Sign Up</a>
        </p>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
